services:
  bot:
    build: .
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Defina DISCORD_TOKEN no arquivo .env}
      CONFIG_DIR: /app/config
      DATA_DIR: /app/data
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./config:/app/config:ro
      - bot-data:/app/data
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
