[package]
name = "discord-server-bot"
version = "2.0.0-dev.1"
edition = "2024"
rust-version = "1.98"
publish = false
default-run = "discord-server-bot"

[dependencies]
anyhow = "1"
dotenvy = "0.15"
poise = "0.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
url = "2"
tempfile = "3"
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http = "1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
