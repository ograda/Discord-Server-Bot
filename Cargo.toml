[package]
name = "discord-server-bot"
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
anyhow = "1"
dotenvy = "0.15"
poise = "0.6.2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
